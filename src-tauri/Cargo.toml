[package]
name = "alignment-forge"
version = "0.1.0"
description = "High-Performance Batch Phylogenomic Alignment Viewer and Trimming Engine"
authors = ["Carl Hutter"]
edition = "2021"

[lib]
name = "alignment_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Portable engine dependencies. These compile for the desktop target and for
# WebAssembly, so one trimming engine backs both the desktop app and the browser.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Desktop only: shell, file dialogs, thread pool, and format writers.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
toml = "0.8.2"
rayon = "1.10"
walkdir = "2.5"
csv = "1.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

# Browser only: the JavaScript boundary.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Unwind rather than abort. A panic in one alignment is then reported to the
# user as a failed command instead of closing the whole application, and
# `catch_unwind` in the command layer can turn it into an error message.

# The browser build is optimised for speed. `-O4` is wasm-opt's most aggressive
# setting, and the engine is compute bound rather than download bound.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O4']
