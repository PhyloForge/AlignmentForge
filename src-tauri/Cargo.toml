[package]
name = "alignment-forge"
version = "0.1.0"
description = "High-Performance Batch Phylogenomic Alignment Viewer and Trimming Engine"
authors = ["Carl Hutter"]
edition = "2021"

[lib]
name = "alignment_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8.2"
rayon = "1.10"
memmap2 = "0.9"
walkdir = "2.5"
thiserror = "2.0"
indexmap = { version = "2.7", features = ["serde"] }
csv = "1.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
