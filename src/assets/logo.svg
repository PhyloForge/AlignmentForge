<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Outer Squircle Shadow -->
    <filter id="squircleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>

    <!-- Anvil Metal Gradients -->
    <linearGradient id="anvilBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="80%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="anvilHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#475569" stop-opacity="0"/>
    </linearGradient>

    <!-- Hammer Head Gradient -->
    <linearGradient id="hammerHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Hammer Handle Gradient -->
    <linearGradient id="hammerHandle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Nucleotide Base Gradients -->
    <!-- Green A -->
    <linearGradient id="nucA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <!-- Blue C -->
    <linearGradient id="nucC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <!-- Orange G -->
    <linearGradient id="nucG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <!-- Red T -->
    <linearGradient id="nucT" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <filter id="blockGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <filter id="sparkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- macOS App Icon Squircle Container -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#bgGrad)" filter="url(#squircleShadow)"/>
  
  <!-- Subtle Inset Bevel for Icon Frame -->
  <rect x="65" y="65" width="894" height="894" rx="199" ry="199" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Anvil Drop Shadow -->
  <ellipse cx="512" cy="740" rx="340" ry="36" fill="#0f172a" fill-opacity="0.3" filter="blur(8px)"/>

  <!-- ANVIL -->
  <g id="anvilGroup">
    <!-- Anvil Base & Body Path -->
    <path d="M 280 720 
             L 744 720 
             C 744 720, 720 680, 680 670
             C 630 660, 600 630, 590 560
             L 760 560
             C 770 560, 780 550, 780 540
             L 780 460
             C 780 450, 770 440, 760 440
             L 400 440
             C 340 440, 220 465, 200 475
             C 240 500, 320 530, 420 540
             L 420 560
             C 410 630, 380 660, 330 670
             C 290 680, 280 720, 280 720 Z" 
          fill="url(#anvilBody)" 
          stroke="#0f172a" 
          stroke-width="6" 
          stroke-linejoin="round"/>

    <!-- Anvil Face Top Highlight Plate -->
    <path d="M 390 442 L 760 442 C 768 442, 776 448, 776 456 L 776 462 L 390 462 Z" fill="url(#anvilHighlight)"/>
    
    <!-- Anvil Horn Curved Highlight -->
    <path d="M 206 477 C 240 495, 310 520, 410 532" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Anvil Feet Steppes -->
    <path d="M 290 706 L 734 706" stroke="#64748b" stroke-width="3" opacity="0.8"/>
  </g>

  <!-- SEQUENCE ALIGNMENT MATRIX (4 Taxa Rows x 5 Nucleotide Columns) -->
  <!-- Staggered SNPs: Row 1 Col 5 is Blue C; Row 2 Col 4 is Green A -->
  <g id="alignmentGrid" transform="translate(420, 240)">
    
    <!-- Matrix Container Backdrop -->
    <rect x="-12" y="-12" width="344" height="264" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="4" filter="url(#blockGlow)"/>

    <!-- ROW 1 (Taxon 1): A  A  C  G  [C]  <-- Staggered SNP in Column 5 -->
    <!-- Col 1: A (Green) -->
    <rect x="0" y="0" width="56" height="52" rx="8" fill="url(#nucA)"/>
    <text x="28" y="36" font-family="-apple-system, monospace, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">A</text>
    <!-- Col 2: A (Green) -->
    <rect x="64" y="0" width="56" height="52" rx="8" fill="url(#nucA)"/>
    <text x="92" y="36" font-family="-apple-system, monospace, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">A</text>
    <!-- Col 3: C (Blue) -->
    <rect x="128" y="0" width="56" height="52" rx="8" fill="url(#nucC)"/>
    <text x="156" y="36" font-family="-apple-system, monospace, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">C</text>
    <!-- Col 4: G (Orange) -->
    <rect x="192" y="0" width="56" height="52" rx="8" fill="url(#nucG)"/>
    <text x="220" y="36" font-family="-apple-system, monospace, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">G</text>
    <!-- Col 5: C (Blue SNP!) -->
    <rect x="256" y="0" width="56" height="52" rx="8" fill="url(#nucC)"/>
    <text x="284" y="36" font-family="-apple-system, monospace, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">C</text>


    <!-- ROW 2 (Taxon 2): A  A  C  [A]  T  <-- Staggered SNP in Column 4 -->
    <!-- Col 1: A (Green) -->
    <rect x="0" y="60" width="56" height="52" rx="8" fill="url(#nucA)"/>
    <text x="28" y="96" font-family="-apple-system, monospace, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">A</text>
    <!-- Col 2: A (Green) -->
    <rect x="64" y="60" width="56" height="52" rx="8" fill="url(#nucA)"/>
    <text x="92" y="96" font-family="-apple-system, monospace, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">A</text>
    <!-- Col 3: C (Blue) -->
    <rect x="128" y="60" width="56" height="52" rx="8" fill="url(#nucC)"/>
    <text x="156" y="96" font-family="-apple-system, monospace, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">C</text>
    <!-- Col 4: A (Green SNP!) -->
    <rect x="192" y="60" width="56" height="52" rx="8" fill="url(#nucA)"/>
    <text x="220" y="96" font-family="-apple-system, monospace, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">A</text>
    <!-- Col 5: T (Red) -->
    <rect x="256" y="60" width="56" height="52" rx="8" fill="url(#nucT)"/>
    <text x="284" y="96" font-family="-apple-system, monospace, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">T</text>


    <!-- ROW 3 (Taxon 3): A  A  C  G  T -->
    <!-- Col 1: A (Green) -->
    <rect x="0" y="120" width="56" height="52" rx="8" fill="url(#nucA)"/>
    <text x="28" y="156" font-family="-apple-system, monospace, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">A</text>
    <!-- Col 2: A (Green) -->
    <rect x="64" y="120" width="56" height="52" rx="8" fill="url(#nucA)"/>
    <text x="92" y="156" font-family="-apple-system, monospace, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">A</text>
    <!-- Col 3: C (Blue) -->
    <rect x="128" y="120" width="56" height="52" rx="8" fill="url(#nucC)"/>
    <text x="156" y="156" font-family="-apple-system, monospace, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">C</text>
    <!-- Col 4: G (Orange) -->
    <rect x="192" y="120" width="56" height="52" rx="8" fill="url(#nucG)"/>
    <text x="220" y="156" font-family="-apple-system, monospace, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">G</text>
    <!-- Col 5: T (Red) -->
    <rect x="256" y="120" width="56" height="52" rx="8" fill="url(#nucT)"/>
    <text x="284" y="156" font-family="-apple-system, monospace, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">T</text>


    <!-- ROW 4 (Taxon 4): A  A  C  G  T -->
    <!-- Col 1: A (Green) -->
    <rect x="0" y="180" width="56" height="52" rx="8" fill="url(#nucA)"/>
    <text x="28" y="216" font-family="-apple-system, monospace, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">A</text>
    <!-- Col 2: A (Green) -->
    <rect x="64" y="180" width="56" height="52" rx="8" fill="url(#nucA)"/>
    <text x="92" y="216" font-family="-apple-system, monospace, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">A</text>
    <!-- Col 3: C (Blue) -->
    <rect x="128" y="180" width="56" height="52" rx="8" fill="url(#nucC)"/>
    <text x="156" y="216" font-family="-apple-system, monospace, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">C</text>
    <!-- Col 4: G (Orange) -->
    <rect x="192" y="180" width="56" height="52" rx="8" fill="url(#nucG)"/>
    <text x="220" y="216" font-family="-apple-system, monospace, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">G</text>
    <!-- Col 5: T (Red) -->
    <rect x="256" y="180" width="56" height="52" rx="8" fill="url(#nucT)"/>
    <text x="284" y="216" font-family="-apple-system, monospace, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">T</text>
  </g>

  <!-- BLACKSMITH HAMMER (Angled Strike Position) -->
  <g id="hammerGroup" transform="translate(420, 440) rotate(-35) translate(-100, -180)">
    <!-- Handle -->
    <rect x="85" y="-120" width="30" height="220" rx="8" fill="url(#hammerHandle)" stroke="#271105" stroke-width="3"/>
    
    <!-- Handle Leather Grip Rings -->
    <line x1="85" y1="-70" x2="115" y2="-70" stroke="#1c0c03" stroke-width="4"/>
    <line x1="85" y1="-50" x2="115" y2="-50" stroke="#1c0c03" stroke-width="4"/>
    <line x1="85" y1="-30" x2="115" y2="-30" stroke="#1c0c03" stroke-width="4"/>
    <line x1="85" y1="-10" x2="115" y2="-10" stroke="#1c0c03" stroke-width="4"/>

    <!-- Hammer Head -->
    <path d="M 50 100 
             L 150 100 
             L 156 160 
             L 44 160 Z" 
          fill="url(#hammerHead)" 
          stroke="#0f172a" 
          stroke-width="5" 
          stroke-linejoin="round"/>

    <!-- Hammer Head Metallic Bevel Highlight -->
    <path d="M 56 106 L 144 106 L 148 120 L 52 120 Z" fill="#94a3b8" opacity="0.6"/>
  </g>

  <!-- GOLDEN FORGE SPARKS -->
  <g id="sparks" filter="url(#sparkGlow)">
    <circle cx="390" cy="425" r="5" fill="#fbbf24"/>
    <circle cx="360" cy="390" r="4" fill="#f59e0b"/>
    <circle cx="330" cy="435" r="3.5" fill="#fde68a"/>
    <circle cx="380" cy="360" r="4.5" fill="#fb923c"/>
    <circle cx="340" cy="340" r="3" fill="#fef08a"/>
    <line x1="390" y1="430" x2="350" y2="390" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <line x1="380" y1="420" x2="330" y2="430" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="395" y1="420" x2="370" y2="350" stroke="#fde68a" stroke-width="2" stroke-linecap="round"/>
  </g>

</svg>
